[package]
name = "cranpose-esp32-demo"
version = "0.1.0"
edition = "2024"
description = "A Cranpose screen on an ESP32-S3 through ESP-IDF"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/samoylenkodmitry/cranpose-esp32"
publish = false

[[bin]]
name = "cranpose-esp32-demo"
harness = false

[dependencies]
cranpose = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a432ad7ec6ecb6ebb2994fb1819f1d114496db00", default-features = false, features = ["framebuffer"] }
cranpose-animation = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a432ad7ec6ecb6ebb2994fb1819f1d114496db00" }
cranpose-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a432ad7ec6ecb6ebb2994fb1819f1d114496db00" }
cranpose-platform-esp-idf = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a432ad7ec6ecb6ebb2994fb1819f1d114496db00" }
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = "0.33.5"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
