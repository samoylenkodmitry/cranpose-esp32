name: Build

# Builds the site: the firmware and its boot images, the browser emulator from
# its release, and the page.
on:
  workflow_call:

env:
  QEMU_RELEASE: v0.1.1
  ESPFLASH_RELEASE: v4.6.0

jobs:
  benchmark-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_REVISION: 0a368a66aa2ebc06e4273ab76f7a96e752b12736
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore firmware and captures for this source revision
        id: previews
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: layouts
          key: benchmark-layouts-${{ env.BENCHMARK_REVISION }}-${{ hashFiles('scripts/benchmark_layouts.py', '.github/workflows/build.yml') }}
      - name: Check out the layouts used by the nightly
        if: steps.previews.outputs.cache-hit != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: samoylenkodmitry/Cranpose
          ref: ${{ env.BENCHMARK_REVISION }}
          path: cranpose
          persist-credentials: false
      - name: Build and boot each layout on the virtual panel
        if: steps.previews.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libslirp0
          bash cranpose/scripts/esp32/setup.sh
          "$HOME/.local/esp-qemu/qemu/bin/qemu-system-xtensa" --version
          . "$HOME/export-esp-1.100.0.sh"
          python3 scripts/benchmark_layouts.py cranpose layouts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layout-firmware
          path: layouts/
          if-no-files-found: error
          retention-days: 1

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the Xtensa Rust toolchain and ldproxy
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        # espup reads the toolchain release from the GitHub API, which answers
        # 403 to unauthenticated calls once jobs share a rate limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: esp32s3
          version: 1.98.1.0
          name: esp-1.98.1
          ldproxy: true
          override: false

      - name: Install espflash
        run: |
          curl -fsSL -o espflash.zip \
            "https://github.com/esp-rs/espflash/releases/download/$ESPFLASH_RELEASE/espflash-x86_64-unknown-linux-gnu.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q espflash.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.espressif
            firmware/target
          key: esp32s3-${{ hashFiles('firmware/Cargo.lock', 'firmware/sdkconfig*', 'firmware/rust-toolchain.toml') }}
          restore-keys: esp32s3-

      - name: Build the firmware
        working-directory: firmware
        run: cargo build --release --locked

      - name: Write the boot images
        run: python3 scripts/images.py firmware dist

      - name: Take the browser emulator from its release
        run: |
          base="https://github.com/samoylenkodmitry/cranpose-esp32-qemu/releases/download/$QEMU_RELEASE"
          curl -fsSLO "$base/qemu-esp32s3-wasm.zip"
          curl -fsSLO "$base/qemu-esp32s3-wasm.zip.sha256"
          sha256sum -c qemu-esp32s3-wasm.zip.sha256
          unzip -q qemu-esp32s3-wasm.zip -d dist

      - name: Add the page
        run: cp -R web/. dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emulator-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [site, benchmark-layouts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: emulator-site
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: layout-firmware
          path: dist/benchmarks
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
